<script>
(function () {
  var root = document.querySelector('[data-olesko-share-icons]');
  if (!root) return;
  var titleEl = document.getElementById('film-title');
  var title = (titleEl && titleEl.textContent ? titleEl.textContent.replace(/^\s+|\s+$/g, '') : '') || 'OLESKO';
  var canon = document.querySelector('link[rel="canonical"]');
  var url = (canon && canon.href) ? canon.href : window.location.href.split('#')[0];
  var image = 'https://cdn.prod.website-files.com/6a7b43a328ec101a40bb1d20/6a88c73984092424b60c3dac_olesko-demo-bentley-coast-v2.jpg';
  var u = encodeURIComponent(url);
  var t = encodeURIComponent(title);
  var text = encodeURIComponent(title + ' ' + url);
  var hrefs = {
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + u,
    whatsapp: 'https://wa.me/?text=' + text,
    telegram: 'https://t.me/share/url?url=' + u + '&text=' + t,
    pinterest: 'https://pinterest.com/pin/create/button/?url=' + u + '&media=' + encodeURIComponent(image) + '&description=' + t,
    x: 'https://twitter.com/intent/tweet?text=' + t + '&url=' + u
  };
  Object.keys(hrefs).forEach(function (key) {
    var link = root.querySelector('[data-share="' + key + '"]');
    if (link) link.href = hrefs[key];
  });
  function copyUrl() {
    var btn = document.querySelector('[data-olesko-copy]');
    var done = function () {
      if (!btn) return;
      var prev = btn.textContent;
      btn.textContent = 'COPIED';
      window.setTimeout(function () { btn.textContent = prev; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(url).then(done);
    }
    var input = document.createElement('textarea');
    input.value = url;
    input.setAttribute('readonly', '');
    input.style.cssText = 'position:fixed;top:0;opacity:0;';
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(input);
  }
  document.addEventListener('click', function (event) {
    if (!event.target.closest('[data-olesko-copy]')) return;
    event.preventDefault();
    copyUrl();
  });
})();
</script>
